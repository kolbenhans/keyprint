[package]
name = "keyprint"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Prints every layer of a VIA/Vial keyboard's keymap to a PDF, in your keyboard layout."
repository = "https://github.com/kolbenhans/keyprint"

[dependencies]
qmk-via-api = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lzma-rs = "0.3"
printpdf = "0.7"
ttf-parser = "0.19"
eframe = "0.36.1"
egui = "0.36.1"
egui-file-dialog = "0.15.0"

# os_layout backend deps (copied from keypeek) — read the OS's active
# keyboard layout instead of a static per-language table.
[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = "0.8"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
wayland-client = "0.31.14"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
